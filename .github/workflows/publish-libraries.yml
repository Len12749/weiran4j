name: 发布 Java 组件包

on:
  push:
    tags:
      - 'lib-v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 校验发布版本
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#lib-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'tag 必须形如 lib-v1.2.3'; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: 后端门禁
        working-directory: weiran4j
        run: ./gradlew check --no-daemon -PlibVersion=${{ steps.version.outputs.value }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: OpenSpec 结构检查
        run: node openspec/check.mjs
      - name: 发布 BOM 与库模块到 GitHub Packages
        working-directory: weiran4j
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --no-daemon -PlibVersion=${{ steps.version.outputs.value }}
      - name: 创建组件包 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIB_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'lib-v*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          release_options=(
            --title "组件包 $LIB_VERSION"
            --verify-tag
            --latest=false
            --notes "组件包已发布到 GitHub Packages：com.wulicode.weiran:weiran-dependencies:$LIB_VERSION。"
          )
          if [[ -n "$previous_tag" ]]; then
            release_options+=(--generate-notes --notes-start-tag "$previous_tag")
          fi
          gh release create "$GITHUB_REF_NAME" "${release_options[@]}"
