name: 发布 Java 组件包

on:
  push:
    tags:
      - 'lib-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 校验发布版本
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#lib-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'tag 必须形如 lib-v1.2.3'; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: 后端门禁
        working-directory: weiran4j
        run: ./gradlew check --no-daemon -PlibVersion=${{ steps.version.outputs.value }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: OpenSpec 结构检查
        run: node openspec/check.mjs
      - name: 发布 BOM 与库模块到 GitHub Packages
        working-directory: weiran4j
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --no-daemon -PlibVersion=${{ steps.version.outputs.value }}
