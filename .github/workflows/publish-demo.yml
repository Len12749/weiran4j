name: 发布完整 Demo 镜像

on:
  push:
    tags:
      - 'demo-v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 校验发布版本
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#demo-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'tag 必须形如 demo-v1.2.3'; exit 1; }
          test -f weiran4j/weiran-demo/build.gradle.kts || { echo '完整 Demo 需要 weiran-demo 模块'; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 后端门禁
        working-directory: weiran4j
        run: ./gradlew check --no-daemon
      - name: 验证 Demo bootJar 包含演示模块与演示迁移
        working-directory: weiran4j
        run: |
          ./gradlew :weiran-app:bootJar --no-daemon -Pweiran.demo.image=true -PdemoVersion=${{ steps.version.outputs.value }}
          jar_file="weiran-app/build/libs/weiran-app-${{ steps.version.outputs.value }}.jar"
          unzip -Z1 "$jar_file" | grep -Fx 'BOOT-INF/lib/weiran-demo-${{ steps.version.outputs.value }}.jar'
          unzip -p "$jar_file" 'BOOT-INF/lib/weiran-demo-${{ steps.version.outputs.value }}.jar' > "$RUNNER_TEMP/weiran-demo.jar"
          unzip -Z1 "$RUNNER_TEMP/weiran-demo.jar" | grep '^db/app-demo/' > /dev/null
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: OpenSpec 结构检查
        run: node openspec/check.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建后端镜像
        uses: docker/build-push-action@v7
        with:
          context: ./weiran4j
          file: ./weiran4j/Dockerfile
          load: true
          build-args: |
            WEIRAN_DEMO_IMAGE=true
            WEIRAN_DEMO_VERSION=${{ steps.version.outputs.value }}
          tags: ghcr.io/weiran-tech/weiran4j-demo-backend:${{ steps.version.outputs.value }}
      - name: 构建前端镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          load: true
          tags: ghcr.io/weiran-tech/weiran4j-demo-web:${{ steps.version.outputs.value }}
      - name: 启动完整 Demo 并检查演示菜单
        env:
          WEIRAN_DEMO_VERSION: ${{ steps.version.outputs.value }}
          WEIRAN_DB_PASSWORD: ci-demo-password
          WEIRAN_JWT_SECRET: ci-demo-secret-key-at-least-32-bytes
        shell: bash
        run: |
          docker compose -f deploy/demo/compose.yml up -d
          for attempt in {1..60}; do
            if curl -fsS http://localhost:5202/api-backend/n/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5202/api-backend/n/health
          demo_menu_count="$(docker compose -f deploy/demo/compose.yml exec -T mysql \
            mysql -u root -p"$WEIRAN_DB_PASSWORD" -D weiran4j_demo -N \
            -e 'select count(*) from sys_menu where id = 14')"
          test "$demo_menu_count" = 1
      - name: 清理 Demo 验证容器
        if: always()
        env:
          WEIRAN_DEMO_VERSION: ${{ steps.version.outputs.value }}
          WEIRAN_DB_PASSWORD: ci-demo-password
          WEIRAN_JWT_SECRET: ci-demo-secret-key-at-least-32-bytes
        run: docker compose -f deploy/demo/compose.yml down -v
      - name: 发布后端镜像
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: ./weiran4j
          file: ./weiran4j/Dockerfile
          push: true
          build-args: |
            WEIRAN_DEMO_IMAGE=true
            WEIRAN_DEMO_VERSION=${{ steps.version.outputs.value }}
          tags: ghcr.io/weiran-tech/weiran4j-demo-backend:${{ steps.version.outputs.value }}
      - name: 发布前端镜像
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ghcr.io/weiran-tech/weiran4j-demo-web:${{ steps.version.outputs.value }}
      - name: 创建 Demo Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEMO_VERSION: ${{ steps.version.outputs.value }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          sed "s/REPLACE_WITH_RELEASE_VERSION/$DEMO_VERSION/" deploy/demo/.env.example > demo.env.example
          cp deploy/demo/compose.yml compose.yml
          library_tag="$(git describe --tags --match 'lib-v*' --abbrev=0 2>/dev/null || true)"
          {
            echo "Demo $DEMO_VERSION"
            echo
            echo "源码提交：$GITHUB_SHA"
            echo "此提交可追溯的最近组件包 tag：${library_tag:-尚未发布}。Demo 镜像直接从本提交源码构建，可能包含该组件包 tag 之后的改动。"
            echo
            echo "后端镜像：ghcr.io/weiran-tech/weiran4j-demo-backend:$DEMO_VERSION@$BACKEND_DIGEST"
            echo "前端镜像：ghcr.io/weiran-tech/weiran4j-demo-web:$DEMO_VERSION@$WEB_DIGEST"
            echo
            echo "下载 compose.yml 和 demo.env.example，改名为 .env，填写两个密钥，然后运行 docker compose --env-file .env -f compose.yml up -d。"
          } > demo-release-notes.md
          gh release create "$GITHUB_REF_NAME" compose.yml demo.env.example \
            --title "Demo $DEMO_VERSION" --notes-file demo-release-notes.md
