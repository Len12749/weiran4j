# palantir-java-format（Spotless 用它做 Java 格式化）直接调用 javac 内部 API，
# 在 JDK 16+ 的模块系统下必须显式 --add-exports 才能访问。缺这几行时它会以
# `palantir-java-format(java.lang.reflect.InvocationTargetException)` 的形式随机失败在
# 不同文件上 —— 报错既不指向真实原因，也不稳定复现，非常容易被误判成代码问题。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存暂时关闭。
#
# 原因（已实测定位，不是猜测）：Spotless 的 palantir-java-format 步骤在配置缓存恢复的
# 类加载器里拿不到上面那几个 --add-exports 的模块开放，于是 palantir 在
# `JavaInput.<clinit>` 抛 IllegalAccessError（访问 com.sun.tools.javac.util.Log），
# Spotless 把它包成 `palantir-java-format(java.lang.reflect.InvocationTargetException)`
# 报成「lint 错误」。
#
# 症状极具迷惑性：每次失败的文件集合都不同（实测 3 → 1 → 2），因为已通过的文件会
# UP-TO-DATE 不再重跑，看起来像是某些文件「格式有问题」，实际与文件内容无关。
#
# 实测对照：`./gradlew spotlessCheck --no-configuration-cache --rerun-tasks` 连跑 3 次全绿；
# 开启配置缓存时同样命令间歇失败。
#
# 代价：配置阶段不再被缓存，冷构建慢几秒。相比一个会随机变红、且报错指向错误方向的
# 质量门禁，这个代价是值得付的——不可信的门禁比没有门禁更糟。
#
# 何时可以打开：Spotless 修复其配置缓存兼容性后，或改用不依赖 javac 内部 API 的格式化器。
org.gradle.configuration-cache=false

# 本仓模块统一走仓内 BOM 工程依赖（:weiran-dependencies），不按坐标解析。
weiran.conventions.use-project-bom=true

# 骨架期覆盖率门禁：纵向切片模块自行提高，聚合与占位模块不因缺测试而红灯。
weiran.conventions.jacoco.line.minimum=0.45
