<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>常青藤大赛管理后台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#1f2937}
    button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#7f1d1d,#dc2626)}
    .login-card{width:min(400px,90vw);background:#fff;padding:36px;border-radius:16px;box-shadow:0 24px 60px #450a0a66}.login h1{margin:0 0 8px}.muted{color:#6b7280}
    input,select{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.field{margin:16px 0}.btn{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:#b91c1c;color:#fff}.btn.gray{background:#475569}.btn.green{background:#15803d}.btn.orange{background:#c2410c}.btn.small{padding:5px 9px;font-size:12px}.error{color:#b91c1c;min-height:22px}
    .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:22px 14px}.brand{font-size:20px;font-weight:700;padding:0 10px 22px}.nav button{width:100%;text-align:left;background:transparent;color:#d1d5db;border:0;padding:11px 12px;border-radius:7px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#b91c1c;color:#fff}
    .main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:16px}.card,.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px #00000012}.metric{font-size:28px;font-weight:700;margin-top:6px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{max-width:300px}.toolbar select{width:150px}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #e5e7eb}th{background:#f8fafc}.pager{display:flex;gap:8px;align-items:center;margin-top:14px}.badge{padding:3px 8px;border-radius:99px;background:#e5e7eb;font-size:12px}.badge.ok{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}
    .filters{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-bottom:14px}.filters .wide{grid-column:span 2}.filter-actions{display:flex;gap:8px;align-items:end}.filter-actions button{height:40px}dialog{border:0;border-radius:14px;padding:0;width:min(720px,92vw);box-shadow:0 25px 70px #0005}dialog::backdrop{background:#11182799}.modal-head,.modal-foot{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}.modal-foot{border:0;border-top:1px solid #e5e7eb;justify-content:flex-end;gap:10px}.modal-body{padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.modal-body label{display:grid;gap:5px}.modal-body label.wide{grid-column:1/-1}.modal-body textarea{min-height:120px;padding:10px;border:1px solid #d1d5db;border-radius:8px;resize:vertical}
    @media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.cards,.filters,.modal-body{grid-template-columns:1fr}.filters .wide{grid-column:span 1}.main{padding:14px}.toolbar{flex-wrap:wrap}}
  </style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-card"><h1>管理后台</h1><div class="muted">常青藤全国青少年校园戏剧创意大赛</div><div class="field"><input id="username" autocomplete="username" placeholder="管理员账号" required></div><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="密码" required></div><div id="loginError" class="error"></div><button class="btn" style="width:100%">登录</button></form></section>
<section id="app" class="layout hidden">
  <aside class="side"><div class="brand"><span class="brand-mark">常</span><span>常青藤赛事管理<small>赛事运营管理平台</small></span></div><nav class="nav" id="nav">
    <div class="nav-group"><div class="nav-group-title">工作台</div><button data-view="dashboard" data-icon="⌂" class="active">数据概览</button><button data-view="statistics" data-icon="▥">统计分析</button></div>
    <div class="nav-group"><div class="nav-group-title">报名与赛事</div><button data-view="entries" data-icon="▤">作品管理</button><button data-view="imports" data-icon="⇧">作品导入</button><button data-view="accounts" data-icon="♙">报名账号</button><button data-view="schoolQualifications" data-icon="✓">学校届次资格</button><button data-view="competitions" data-icon="◆">赛事管理</button><button data-view="categories" data-icon="▦">赛项管理</button><button data-view="regions" data-icon="⌖">赛区管理</button><button data-view="majors" data-icon="◇">组别管理</button></div>
    <div class="nav-group"><div class="nav-group-title">评审中心</div><button data-view="reviewPhases" data-icon="◷">评审阶段</button><button data-view="reviewerScopes" data-icon="◎">评委管理</button><button data-view="reviewerTasks" data-icon="✎">我的评分</button><button data-view="assignments" data-icon="⇄">评委分配</button><button data-view="scoreImports" data-icon="⇧">成绩导入</button><button data-view="scores" data-icon="▥">成绩统计</button><button data-view="scorePublishing" data-icon="✓">成绩发布</button></div>
    <div class="nav-group"><div class="nav-group-title">奖项与证书</div><button data-view="awardsManagement" data-icon="★">奖项管理</button><button data-view="awardImports" data-icon="⇧">奖项二次导入</button><button data-view="awardRules" data-icon="☆">奖项规则</button><button data-view="awardBatches" data-icon="◈">奖项批次</button><button data-view="certificates" data-icon="▣">证书管理</button></div>
    <div class="nav-group"><div class="nav-group-title">内容运营</div><button data-view="news" data-icon="▧">资讯管理</button></div>
    <div class="nav-group"><div class="nav-group-title">系统管理</div><button data-view="jobs" data-icon="◴">任务中心</button><button data-view="settings" data-icon="⚙">系统配置</button><button data-view="adminUsers" data-icon="♟">管理员</button><button data-view="roles" data-icon="⌘">角色权限</button><button data-view="logs" data-icon="≡">操作日志</button><button data-view="loginLogs" data-icon="↪">登录日志</button></div>
  </nav></aside>
  <main class="main"><header class="top"><div><div class="breadcrumb">常青藤赛事管理 / <span id="breadcrumbTitle">工作台</span></div><h2 id="viewTitle">数据概览</h2><span id="adminName" class="muted"></span></div><div class="top-actions"><select id="databaseSwitcher" title="切换赛事届次" style="width:230px"></select><button id="taskNotifications" class="btn soft">任务通知 <span id="taskBadge" class="notice-badge hidden">0</span></button><button id="fileLibrary" class="btn soft">文件库</button><button id="logout" class="btn soft">退出登录</button></div></header><div id="content"></div></main>
</section>
<dialog id="formDialog"><form method="dialog" id="dynamicForm"><div class="modal-head"><h3 id="dialogTitle" style="margin:0"></h3><button type="button" data-dialog-close class="btn gray small">关闭</button></div><div class="modal-body" id="dialogFields"></div><div class="modal-foot"><button type="button" data-dialog-close class="btn gray">取消</button><button id="dialogSubmit" type="submit" value="default" class="btn">保存</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s), tokenKey='cqtxj_admin_token', databaseKey='cqtxj_admin_database'; let token=localStorage.getItem(tokenKey)||'', editionDatabase=localStorage.getItem(databaseKey)||'cqtxj2026', page=1, view='dashboard', settingsData=[], competitionsData=[], categoriesData=[], phasesData=[], awardsData=[], newsData=[], usersData=[], rolesData=[], permissionsData=[], filterOptions=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ask=(label,value='')=>prompt(label,String(value??''));
const intValue=(value,fallback=0)=>{const n=parseInt(value,10);return Number.isFinite(n)?n:fallback};
const fieldValue=id=>document.getElementById(id)?.value||'';
const params=obj=>new URLSearchParams(Object.entries(obj).filter(([,v])=>v!==''&&v!==null&&v!==undefined)).toString();
const keepFilters=(prefix,names,state={})=>{if(document.getElementById(prefix+names[0]))names.forEach(n=>state[n]=fieldValue(prefix+n));return state};
async function options(){return filterOptions||(filterOptions=await api('/filter-options'))}
const editionHeaders=()=>({'X-CQTXJ-Database':editionDatabase});
async function api(path,opt={}){const r=await fetch('/api/admin'+path,{...opt,headers:{'Content-Type':'application/json',...editionHeaders(),...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const j=await r.json();if(j.code===401){logout();throw Error(j.message)}if(j.code!==200)throw Error(j.message||'请求失败');return j.data}
function openForm(title,fields,onSubmit){$('#dialogTitle').textContent=title;$('#dialogFields').innerHTML=fields.map(f=>`<label class="${f.wide?'wide':''}"><span>${esc(f.label)}</span>${f.type==='textarea'?`<textarea name="${f.name}" ${f.required?'required':''}>${esc(f.value)}</textarea>`:f.type==='select'?`<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:f.type==='multiselect'?`<select name="${f.name}" multiple size="3">${f.options.map(o=>`<option value="${esc(o.value)}" ${(f.value||[]).map(String).includes(String(o.value))?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value)}" ${f.required?'required':''}>`}</label>`).join('');const dialog=$('#formDialog'),form=$('#dynamicForm');dialog.querySelectorAll('[data-dialog-close]').forEach(button=>button.onclick=()=>dialog.close());setupFormCascades(form);form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));form.querySelectorAll('select[multiple]').forEach(select=>data[select.name]=[...select.selectedOptions].map(option=>option.value));try{$('#dialogSubmit').disabled=true;await onSubmit(data);dialog.close()}catch(x){alert(x.message)}finally{$('#dialogSubmit').disabled=false}};dialog.showModal()}
function setupFormCascades(form){
  const competition=form.elements.competition_id,phase=form.elements.phase_id;
  if(competition&&phase&&filterOptions){
    const selected=phase.value,refresh=()=>{const rows=filterOptions.phases.filter(x=>String(x.competition_id)===String(competition.value));phase.innerHTML=rows.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(rows.some(x=>String(x.id)===String(selected)))phase.value=selected;phase.disabled=!rows.length};
    competition.addEventListener('change',refresh);refresh();
  }
  const first=form.elements.first_category_legacy_id,second=form.elements.second_category_legacy_id;
  if(first&&filterOptions){
    const selectedFirst=first.value,selectedSecond=second?.value;
    const refreshSecond=()=>{if(!second)return;const rows=filterOptions.categories.filter(x=>String(x.parent_legacy_id||0)===String(first.value||0)&&(!competition||!Number(x.competition_id)||String(x.competition_id)===String(competition.value)));second.innerHTML=`<option value="0">全部专业</option>`+rows.map(x=>`<option value="${x.legacy_id}">${esc(x.name)}</option>`).join('');if(rows.some(x=>String(x.legacy_id)===String(selectedSecond)))second.value=selectedSecond;second.disabled=!first.value||!rows.length};
    const refreshFirst=()=>{const rows=filterOptions.categories.filter(x=>!Number(x.parent_legacy_id||0)&&(!competition||!Number(x.competition_id)||String(x.competition_id)===String(competition.value)));first.innerHTML=rows.map(x=>`<option value="${x.legacy_id}">${esc(x.name)}</option>`).join('');if(rows.some(x=>String(x.legacy_id)===String(selectedFirst)))first.value=selectedFirst;first.disabled=!rows.length;refreshSecond()};
    first.addEventListener('change',refreshSecond);if(competition)competition.addEventListener('change',refreshFirst);refreshFirst();
  }
}
function hierarchyOptions(items,parent=0){return items.filter(x=>Number(x.parent_legacy_id||0)===Number(parent))}
function setupCategoryCascade(prefix,state){const first=document.getElementById(prefix+'category_id');if(!first||first.dataset.cascade)return;first.dataset.cascade='1';const items=filterOptions?.categories||[],roots=hierarchyOptions(items),currentFirst=String(state.category_id||''),currentSecond=String(state.second_category_id||'');first.innerHTML=`<option value="">全部赛项</option>`+roots.map(x=>`<option value="${x.legacy_id}">${esc(x.name)}</option>`).join('');first.value=currentFirst;const second=document.createElement('select');second.id=prefix+'second_category_id';first.after(second);const refresh=()=>{const children=hierarchyOptions(items,first.value);second.innerHTML=`<option value="">全部专业</option>`+children.map(x=>`<option value="${x.legacy_id}">${esc(x.name)}</option>`).join('');second.disabled=!first.value||!children.length;second.value=children.some(x=>String(x.legacy_id)===currentSecond)?currentSecond:''};first.onchange=()=>{state.category_id=first.value;state.second_category_id='';refresh()};second.onchange=()=>state.second_category_id=second.value;refresh()}
function logout(){token='';localStorage.removeItem(tokenKey);$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
async function loadDatabaseContexts(){const rows=await api('/database-contexts'),select=$('#databaseSwitcher');select.innerHTML=rows.map(x=>{const edition=x.edition?(String(x.edition).includes('届')?x.edition:`第${x.edition}届`):'';return `<option value="${x.database}" ${x.database===editionDatabase?'selected':''}>${x.year||''}${edition?' · '+esc(edition):''}${x.read_only?'（历史只读）':'（新届）'}</option>`}).join('');select.onchange=async()=>{editionDatabase=select.value;localStorage.setItem(databaseKey,editionDatabase);filterOptions=null;page=1;await boot()}}
async function boot(){if(!token)return;try{const me=await api('/auth/me');window.currentAdmin=me;$('#adminName').textContent=(me.name||me.username)+' · '+(me.roles||[]).map(x=>x.name).join('、')+(me.edition_read_only?' · 历史库只读':' · 新届工作库');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadDatabaseContexts();window.dispatchEvent(new CustomEvent('admin-ready',{detail:me}));await show('dashboard')}catch(e){logout()}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});token=d.access_token;localStorage.setItem(tokenKey,token);await boot()}catch(x){$('#loginError').textContent=x.message}};$('#logout').onclick=logout;
$('#nav').onclick=e=>{const b=e.target.closest('button[data-view]');if(b)show(b.dataset.view)};
async function show(name){view=name;page=1;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));const titles={dashboard:'数据概览',statistics:'统计分析',entries:'作品管理',imports:'作品导入',accounts:'报名账号',schoolQualifications:'学校届次资格',competitions:'赛事管理',categories:'赛项管理',regions:'赛区管理',majors:'组别管理',reviewPhases:'评审阶段',reviewerScopes:'评委管理',reviewerTasks:'我的评分',assignments:'评委分配',scoreImports:'成绩导入',scores:'成绩统计',scorePublishing:'成绩发布',awardsManagement:'奖项管理',awardImports:'奖项二次导入',awardRules:'奖项规则',awardBatches:'奖项批次',certificates:'证书管理',news:'资讯管理',jobs:'任务中心',settings:'系统配置',adminUsers:'管理员',roles:'角色权限',logs:'操作日志',loginLogs:'登录日志'};$('#viewTitle').textContent=titles[name];const breadcrumb=$('#breadcrumbTitle');if(breadcrumb)breadcrumb.textContent=titles[name];$('#content').innerHTML='<div class="panel loading-panel">数据加载中…</div>';try{await ({dashboard,statistics,entries,imports,accounts,schoolQualifications,competitions,categories,regions,majors,reviewPhases,reviewerScopes,reviewerTasks,assignments,scoreImports,scores,scorePublishing,awardsManagement,awardImports,awardRules,awardBatches,certificates,news,jobs,settings,adminUsers,roles,logs,loginLogs}[name])()}catch(e){$('#content').innerHTML='<div class="panel error">'+esc(e.message)+'</div>'}}
async function dashboard(){const [e,a,c,ca,p,w,n,s,u,r]=await Promise.all([api('/entries?limit=1'),api('/accounts?limit=1'),api('/competitions'),api('/categories'),api('/review/phases'),api('/awards/rules'),api('/news'),api('/settings'),api('/users'),api('/roles')]);$('#content').innerHTML=`<div class="cards"><div class="card"><div class="muted">报名作品</div><div class="metric">${e.total.toLocaleString()}</div></div><div class="card"><div class="muted">前台账号</div><div class="metric">${a.total.toLocaleString()}</div></div><div class="card"><div class="muted">赛事</div><div class="metric">${c.length}</div></div><div class="card"><div class="muted">赛项</div><div class="metric">${ca.length}</div></div><div class="card"><div class="muted">评审阶段</div><div class="metric">${p.length}</div></div><div class="card"><div class="muted">奖项规则</div><div class="metric">${w.length}</div></div><div class="card"><div class="muted">资讯</div><div class="metric">${n.length}</div></div><div class="card"><div class="muted">系统配置</div><div class="metric">${s.length}</div></div><div class="card"><div class="muted">管理员</div><div class="metric">${u.length}</div></div><div class="card"><div class="muted">角色</div><div class="metric">${r.length}</div></div></div>`}
async function statistics(){const names=['competition_id','region_id','category_id','entry_type','group_name','date_from','date_to'];window.statisticsFilterState=keepFilters('stf_',names,window.statisticsFilterState||{});const [d,o]=await Promise.all([api('/statistics?'+params(window.statisticsFilterState)),options()]),f=window.statisticsFilterState;const blocks=(title,rows)=>`<div class="panel"><h3>${title}</h3><div class="table-wrap"><table><thead><tr><th>分类</th><th>数量</th><th>占比</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${Number(x.value).toLocaleString()}</td><td><div style="background:#fee2e2;width:${Math.max(2,Math.round(x.value/Math.max(rows[0].value,1)*100))}%;height:8px;border-radius:4px"></div></td></tr>`).join(''):'<tr><td colspan="3">暂无数据</td></tr>'}</tbody></table></div></div>`;$('#content').innerHTML=`<div class="panel"><div class="filters"><select id="stf_competition_id"><option value="">全部赛事</option>${o.competitions.map(x=>`<option value="${x.id}" ${String(x.id)===f.competition_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="stf_region_id"><option value="">全部赛区</option>${o.regions.map(x=>`<option value="${x.id}" ${String(x.id)===f.region_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="stf_category_id"><option value="">全部赛项</option>${o.categories.map(x=>`<option value="${x.legacy_id}" ${String(x.legacy_id)===f.category_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="stf_entry_type"><option value="">全部类型</option><option value="INDIVIDUAL" ${f.entry_type==='INDIVIDUAL'?'selected':''}>个人</option><option value="TEAM" ${f.entry_type==='TEAM'?'selected':''}>团体</option></select><input id="stf_group_name" placeholder="组别" value="${esc(f.group_name)}"><input id="stf_date_from" type="date" value="${esc(f.date_from)}"><input id="stf_date_to" type="date" value="${esc(f.date_to)}"><div class="filter-actions"><button class="btn" onclick="statistics()">统计</button><button class="btn gray" onclick="window.statisticsFilterState={};statistics()">重置</button></div></div></div><div class="cards">${Object.entries(d.totals).map(([k,v])=>`<div class="card"><div class="muted">${({entries:'作品',accounts:'账号',people:'参赛人员',scores:'有效评分',awards:'奖项',certificates:'证书'})[k]||k}</div><div class="metric">${Number(v).toLocaleString()}</div></div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px">${blocks('数据来源',d.sources)}${blocks('作品状态',d.statuses)}${blocks('赛项分布 TOP20',d.categories)}${blocks('赛区分布 TOP20',d.regions)}${blocks('个人/团体',d.entry_types)}${blocks('组别分布',d.groups)}${blocks('报名月份趋势',d.months)}</div>`}
function pager(total,limit){return `<div class="pager"><button class="btn gray small" onclick="goPage(-1)">上一页</button><span>第 ${page} 页 / 共 ${Math.max(1,Math.ceil(total/limit))} 页，${total} 条</span><button class="btn gray small" onclick="goPage(1)">下一页</button></div>`}
window.goPage=d=>{page=Math.max(1,page+d);({entries,accounts,scores,certificates,jobs,logs}[view]||(()=>{}))()};
async function entries(){const names=['keyword','author','idcard','school','teacher','major','competition_id','category_id','region_id','entry_type','source_database','status','date_from','date_to'];window.entryFilterState=keepFilters('ef_',names,window.entryFilterState||{});const [d,o]=await Promise.all([api(`/entries?page=${page}&limit=20&${params(window.entryFilterState)}`),options()]);const f=window.entryFilterState;$('#content').innerHTML=`<div class="panel"><div class="filters"><input id="ef_keyword" class="wide" placeholder="报名号或作品标题" value="${esc(f.keyword)}"><input id="ef_author" placeholder="作者/成员姓名" value="${esc(f.author)}"><input id="ef_idcard" placeholder="证件号" value="${esc(f.idcard)}"><input id="ef_school" placeholder="学校名称" value="${esc(f.school)}"><input id="ef_teacher" placeholder="指导教师" value="${esc(f.teacher)}"><input id="ef_major" placeholder="专业" value="${esc(f.major)}"><select id="ef_competition_id"><option value="">全部赛事</option>${o.competitions.map(x=>`<option value="${x.id}" ${String(x.id)===f.competition_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="ef_category_id"><option value="">全部赛项</option>${o.categories.map(x=>`<option value="${x.legacy_id}" ${String(x.legacy_id)===f.category_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="ef_region_id"><option value="">全部赛区</option>${o.regions.map(x=>`<option value="${x.id}" ${String(x.id)===f.region_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="ef_entry_type"><option value="">全部提交类型</option><option value="INDIVIDUAL" ${f.entry_type==='INDIVIDUAL'?'selected':''}>个人</option><option value="TEAM" ${f.entry_type==='TEAM'?'selected':''}>团体</option></select><select id="ef_source_database"><option value="">全部来源</option><option value="zhongxi" ${f.source_database==='zhongxi'?'selected':''}>中戏</option><option value="qudao" ${f.source_database==='qudao'?'selected':''}>渠道</option><option value="houtai" ${f.source_database==='houtai'?'selected':''}>后台</option></select><select id="ef_status"><option value="">全部状态</option>${['ACTIVE','REJECTED','WITHDRAWN','DELETED','HISTORICAL'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${statusLabel(x)}</option>`).join('')}</select><input id="ef_date_from" type="date" value="${esc(f.date_from)}"><input id="ef_date_to" type="date" value="${esc(f.date_to)}"><div class="filter-actions"><button class="btn" onclick="page=1;entries()">筛选</button><button class="btn gray" onclick="window.entryFilterState={};entries()">重置</button><button class="btn gray" onclick="exportEntries()">导出</button></div></div><div class="muted" style="margin-bottom:10px">共 ${d.total.toLocaleString()} 条，筛选和导出使用同一业务字段</div><div class="table-wrap"><table><thead><tr><th>ID</th><th>报名号</th><th>作品</th><th>类型</th><th>赛事</th><th>赛区</th><th>赛项</th><th>人数</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.data.map(x=>`<tr><td>${x.id}</td><td>${esc(x.entry_no)}</td><td title="${esc(x.title)}">${esc(x.title).slice(0,24)}</td><td>${x.entry_type==='TEAM'?'团体':'个人'}</td><td>${esc(x.competition_name)}</td><td>${esc(x.region_name)}</td><td>${esc(x.first_category_name)}</td><td>${x.participant_count}</td><td><span class="badge ${x.status==='ACTIVE'?'ok':x.status==='REJECTED'?'bad':''}">${esc(statusLabel(x.status))}</span></td><td><button class="btn gray small" onclick="entryDetail(${x.id})">详情</button> <button class="btn green small" onclick="reviewEntry(${x.id},'APPROVED')">通过</button> <button class="btn orange small" onclick="reviewEntry(${x.id},'REJECTED')">驳回</button></td></tr>`).join('')}</tbody></table></div>${pager(d.total,d.limit)}</div>`}
window.entryDetail=async id=>{try{const x=await api('/entries/'+id);window.currentEntryDetails=x;$('#content').innerHTML=`<div class="panel"><button class="btn gray" onclick="entries()">返回列表</button><h3>${esc(x.title)}</h3><p>报名号：${esc(x.entry_no)}　状态：${esc(statusLabel(x.status))}　指导教师：${esc(x.teacher_names)}</p><p>作品说明：${esc(x.description)}</p><h3>参赛人员（${x.participants.length}）</h3><div class="table-wrap"><table><thead><tr><th>姓名</th><th>身份类型</th><th>证件号</th><th>电话</th><th>学校</th><th>角色</th><th>队长</th><th>状态</th><th>操作</th></tr></thead><tbody>${x.participants.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.credential_type==='OTHER'?'其他':'身份证号'}</td><td>${esc(p.idcard)}</td><td>${esc(p.phone)}</td><td>${esc(p.school)}</td><td>${esc(p.role_name)}</td><td>${p.is_leader?'是':'否'}</td><td>${esc(p.status)}</td><td><button class="btn small" onclick="editParticipant(${id},${p.id})">编辑</button> ${p.status==='ACTIVE'?`<button class="btn orange small" onclick="removeParticipant(${id},${p.id})">移出</button>`:''}</td></tr>`).join('')}</tbody></table></div><h3>审核记录</h3><div class="table-wrap"><table><tbody>${x.review_actions.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.decision)}</td><td>${esc(a.comment)}</td></tr>`).join('')}</tbody></table></div></div>`}catch(e){alert(e.message)}};
window.editParticipant=(entryId,participantId)=>{const p=(window.currentEntryDetails?.participants||[]).find(x=>x.id===participantId);if(!p)return;openForm('编辑参赛成员',[{name:'name',label:'姓名',value:p.name,required:true},{name:'idcard',label:'证件号',value:p.idcard},{name:'phone',label:'联系电话',value:p.phone},{name:'school',label:'学校',value:p.school},{name:'role_name',label:'角色',value:p.role_name},{name:'sort_order',label:'排序',type:'number',value:p.sort_order},{name:'is_leader',label:'是否队长',type:'select',value:p.is_leader?1:0,options:[{value:0,label:'否'},{value:1,label:'是'}]}],async data=>{await api(`/entries/${entryId}/participants/${p.id}`,{method:'PATCH',body:JSON.stringify(data)});entryDetail(entryId)})};
window.removeParticipant=async(entryId,id)=>{if(!confirm('确定将该成员移出作品？历史数据会保留。'))return;try{await api(`/entries/${entryId}/participants/${id}`,{method:'DELETE'});entryDetail(entryId)}catch(e){alert(e.message)}};

window.exportAwardEntries=async()=>{try{const r=await fetch('/api/admin/awards-complete-export.csv?'+params(window.awardFilterState||{}),{headers:{Authorization:'Bearer '+token,...editionHeaders()}});if(!r.ok)throw Error('奖项数据导出失败');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='奖项数据.csv';a.click();URL.revokeObjectURL(url)}catch(e){alert(e.message)}};
window.reviewEntry=(id,decision)=>openForm(decision==='APPROVED'?'作品审核通过':'作品审核驳回',[{name:'comment',label:decision==='APPROVED'?'审核备注':'驳回原因',type:'textarea',wide:true,required:decision!=='APPROVED',value:''}],async data=>{await api(`/entries/${id}/review`,{method:'POST',body:JSON.stringify({decision,comment:data.comment})});await entries()});
async function imports(){const [rows,o]=await Promise.all([api('/imports'),options()]),sourceLabels={zhongxi:'中戏',qudao:'渠道',houtai:'后台'},sources=window.currentAdmin?.source_databases||[];window.importRows=rows;$('#content').innerHTML=`<div class="panel"><h3>新建作品导入</h3><p class="muted">按管理员的数据来源权限选择导入渠道。中戏按一个作品评分；渠道和后台按每位参赛人员评分。Excel 使用身份类型＋证件号，每位成员单独填写学校和组别；有 ZIP 类型附件时同时上传压缩包。</p><form id="adminImportForm" class="filters"><select name="source_database" required><option value="">选择导入渠道</option>${sources.map(source=>`<option value="${source}">${sourceLabels[source]}</option>`).join('')}</select><select name="competition_id" required><option value="">选择赛事</option>${o.competitions.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label>Excel 报名表<input name="excel_file" type="file" accept=".xlsx" required></label><label>作品附件 ZIP<input name="zip_file" type="file" accept=".zip"></label><div class="filter-actions"><button class="btn" type="submit" ${sources.length?'':'disabled'}>预检并提交导入</button><button class="btn gray" type="button" onclick="downloadImportTemplate()">下载模板</button></div></form>${sources.length?'':'<p class="error">当前账号未分配数据来源权限，请联系超级管理员。</p>'}<h3 style="margin-top:24px">导入记录</h3><div class="table-wrap"><table><thead><tr><th>时间</th><th>导入渠道</th><th>赛事</th><th>文件</th><th>状态</th><th>进度</th><th>成功</th><th>失败</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${sourceLabels[x.source_database]||x.source_database}</td><td>${esc(x.competition_name)}</td><td>${esc(x.excel_name)}</td><td>${['等待','处理中','完成','失败'][x.status]||x.status}</td><td>${x.progress}%</td><td>${x.success_count}</td><td>${x.failed_count}</td><td><button class="btn gray small" onclick="importDetail('${x.job_id}')">结果</button></td></tr>`).join('')||'<tr><td colspan="9">暂无导入任务</td></tr>'}</tbody></table></div></div>`;$('#adminImportForm').onsubmit=submitAdminImport}
async function submitAdminImport(e){e.preventDefault();const form=new FormData(e.currentTarget),button=e.currentTarget.querySelector('button[type=submit]');button.disabled=true;try{const r=await fetch('/api/admin/imports',{method:'POST',headers:{Authorization:'Bearer '+token,...editionHeaders()},body:form}),j=await r.json();if(j.code!==200)throw Error(j.message);alert('导入任务已进入队列');await imports()}catch(x){alert(x.message)}finally{button.disabled=false}}
window.importDetail=async jobId=>{const x=await api('/imports/'+jobId);$('#content').innerHTML=`<div class="panel"><button class="btn gray" onclick="imports()">返回导入记录</button><h3>导入结果：${esc(x.excel_name)}</h3><p>总行数 ${x.total_rows}，成功 ${x.success_count}，失败 ${x.failed_count}</p><div class="table-wrap"><table><thead><tr><th>行号</th><th>姓名</th><th>身份类型</th><th>证件号</th><th>作品</th><th>结果</th><th>错误</th></tr></thead><tbody>${x.rows.map(r=>`<tr><td>${r.row_number}</td><td>${esc(r.name_value)}</td><td>${esc(r.credential_type)}</td><td>${esc(r.id_card_value)}</td><td>${esc(r.title_value)}</td><td>${r.status===1?'成功':'失败'}</td><td>${esc(r.error_message)}</td></tr>`).join('')}</tbody></table></div></div>`}

async function scoreImports(){const [rows,o]=await Promise.all([api('/score-imports'),options()]),sourceLabels={zhongxi:'中戏',qudao:'渠道',houtai:'后台'},modeLabels={INITIAL:'首次导入',CORRECTION:'成绩修正'},statusLabels={PROCESSING:'处理中',SUCCESS:'成功',REJECTED:'整批驳回'},sources=window.currentAdmin?.source_databases||[];window.scoreImportRows=rows;$('#content').innerHTML=`<div class="panel"><h3>导入省赛或国赛成绩</h3><p class="muted">先选择届次和评审阶段。中戏使用报名号匹配作品；渠道、后台使用报名号＋身份类型＋证件号匹配人员。任意一行不符合规则，整份成绩文件全部驳回。</p><form id="scoreImportForm" class="filters"><select id="sif_competition" name="competition_id" required><option value="">选择届次</option>${o.competitions.map(x=>`<option value="${x.id}">${esc(x.name)}${x.edition?' · '+esc(x.edition):''}</option>`).join('')}</select><select id="sif_phase" name="phase_id" required><option value="">先选择届次</option></select><select name="source_database" required><option value="">选择数据来源</option>${sources.map(x=>`<option value="${x}">${sourceLabels[x]}</option>`).join('')}</select><select id="sif_mode" name="import_mode"><option value="INITIAL">首次导入</option><option value="CORRECTION">成绩修正</option></select><label>Excel 成绩表<input name="excel_file" type="file" accept=".xlsx" required></label><input id="sif_reason" name="correction_reason" class="wide" placeholder="成绩修正原因（修正模式必填）" disabled><div class="filter-actions"><button class="btn" type="submit">预检并整批导入</button><button class="btn gray" type="button" onclick="downloadScoreImportTemplate()">下载模板</button></div></form><div class="muted">国赛成绩仅允许导入省赛状态为“晋级”的评分对象；已经发布的阶段必须先撤回发布。</div><h3 style="margin-top:24px">成绩导入记录</h3><div class="table-wrap"><table><thead><tr><th>时间</th><th>届次</th><th>阶段</th><th>来源</th><th>模式</th><th>文件</th><th>状态</th><th>成功</th><th>失败</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.competition_name)}</td><td>${esc(x.phase_name)}</td><td>${sourceLabels[x.source_database]}</td><td>${modeLabels[x.import_mode]}</td><td>${esc(x.excel_name)}</td><td><span class="badge ${x.status==='SUCCESS'?'ok':x.status==='REJECTED'?'bad':''}">${statusLabels[x.status]}</span></td><td>${x.success_count}</td><td>${x.failed_count}</td><td><button class="btn gray small" onclick="scoreImportDetail('${x.job_id}')">结果</button></td></tr>`).join('')||'<tr><td colspan="10">暂无成绩导入记录</td></tr>'}</tbody></table></div></div>`;const competition=$('#sif_competition'),phase=$('#sif_phase'),mode=$('#sif_mode'),reason=$('#sif_reason');competition.onchange=()=>{const phases=o.phases.filter(x=>String(x.competition_id)===competition.value&&['PROVINCIAL','NATIONAL'].includes(x.code));phase.innerHTML='<option value="">选择省审或国审</option>'+phases.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')};mode.onchange=()=>{reason.disabled=mode.value!=='CORRECTION';reason.required=mode.value==='CORRECTION';if(reason.disabled)reason.value=''};$('#scoreImportForm').onsubmit=submitScoreImport}
async function submitScoreImport(e){e.preventDefault();const button=e.currentTarget.querySelector('button[type=submit]');button.disabled=true;try{const response=await fetch('/api/admin/score-imports',{method:'POST',headers:{Authorization:'Bearer '+token,...editionHeaders()},body:new FormData(e.currentTarget)}),result=await response.json();if(result.code!==200)throw Error(result.message);alert(result.message+(result.data?.error_message?'\n'+result.data.error_message:''));await scoreImports()}catch(error){alert(error.message)}finally{button.disabled=false}}

async function accounts(){const names=['keyword','name','idcard','phone','school','uniid','type','region_id','audit_status','source_database','date_from','date_to'];window.accountFilterState=keepFilters('af_',names,window.accountFilterState||{});const [d,o]=await Promise.all([api(`/accounts?page=${page}&limit=20&${params(window.accountFilterState)}`),options()]);const f=window.accountFilterState;$('#content').innerHTML=`<div class="panel"><div class="filters"><input id="af_keyword" class="wide" placeholder="综合搜索" value="${esc(f.keyword)}"><input id="af_name" placeholder="姓名/单位名称" value="${esc(f.name)}"><input id="af_idcard" placeholder="证件号" value="${esc(f.idcard)}"><input id="af_phone" placeholder="联系电话" value="${esc(f.phone)}"><input id="af_school" placeholder="学校名称" value="${esc(f.school)}"><input id="af_uniid" placeholder="统一社会信用代码" value="${esc(f.uniid)}"><select id="af_type"><option value="">全部类型</option><option value="1" ${f.type==='1'?'selected':''}>个人</option><option value="2" ${f.type==='2'?'selected':''}>学校</option></select><select id="af_region_id"><option value="">全部赛区</option>${o.regions.map(x=>`<option value="${x.id}" ${String(x.id)===f.region_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="af_audit_status"><option value="">全部审核状态</option><option value="0" ${f.audit_status==='0'?'selected':''}>通过</option><option value="1" ${f.audit_status==='1'?'selected':''}>待审</option><option value="2" ${f.audit_status==='2'?'selected':''}>拒绝</option></select><select id="af_source_database"><option value="">全部来源</option><option value="zhongxi" ${f.source_database==='zhongxi'?'selected':''}>中戏</option><option value="qudao" ${f.source_database==='qudao'?'selected':''}>渠道</option></select><input id="af_date_from" type="date" value="${esc(f.date_from)}"><input id="af_date_to" type="date" value="${esc(f.date_to)}"><div class="filter-actions"><button class="btn" onclick="page=1;accounts()">筛选</button><button class="btn gray" onclick="window.accou async function reviewerTasks(){const phase=fieldValue('rt_phase'),status=fieldValue('rt_status'),keyword=fieldValue('rt_keyword');const [all,o]=await Promise.all([api('/review/tasks'+(phase?'?phase_id='+phase:'')),options()]);const d=all.filter(x=>(!status||(status==='SCORED'?x.score!==null:x.score===null))&&(!keyword||`${x.entry_no} ${x.title}`.includes(keyword)));$('#content').innerHTML=`<div class="panel"><div class="filters"><input id="rt_keyword" class="wide" placeholder="作品名或报名号" value="${esc(keyword)}"><select id="rt_phase"><option value="">全部阶段</option>${o.phases.map(p=>`<option value="${p.id}" ${String(p.id)===phase?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="rt_status"><option value="">全部评分状态</option><option value="PENDING" ${status==='PENDING'?'selected':''}>待评分</option><option value="SCORED" ${status==='SCORED'?'selected':''}>已评分</option></select><div class="filter-actions"><button class="btn" onclick="reviewerTasks()">筛选</button></div></div><div class="cards" style="margin-bottom:16px"><div class="card"><div class="muted">任务总数</div><div class="metric">${all.length}</div></div><div class="card"><div class="muted">已评分</div><div class="metric">${all.filter(x=>x.score!==null).length}</div></div><div class="card"><div class="muted">待评分</div><div class="metric">${all.filter(x=>x.score===null).length}</div></div></div><div class="table-wrap"><table><thead><tr><th>阶段</th><th>报名号</th><th>作品</th><th>类型</th><th>专业/组别</th><th>分数范围</th><th>当前分数</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.map(x=>`<tr><td>${esc(x.phase_name)}</td><td>${esc(x.entry_no)}</td><td>${esc(x.title).slice(0,32)}</td><td>${x.entry_type==='TEAM'?'团体':'个人'}</td><td>${esc(x.major_name)} / ${esc(x.group_name)}</td><td>${x.score_min??0}-${x.score_max??100}</td><td>${x.score??'-'}</td><td><span class="badge ${x.score!==null?'ok':''}">${x.score!==null?'已评分':'待评分'}</span></td><td><button class="btn gray small" onclick="reviewTaskDetail(${x.assignment_id})">详情</button> <button class="btn small" onclick="scoreTask(${x.assignment_id})">${x.score!==null?'修改评分':'评分'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
window.reviewTaskDetail=async id=>{const x=await api('/review/assignments/'+id);$('#content').innerHTML=`<div class="panel"><button class="btn gray" onclick="reviewerTasks()">返回任务</button><h3>${esc(x.title)}</h3><p>阶段：${esc(x.phase_name)}　报名号：${esc(x.entry_no)}　分数范围：${x.score_min}-${x.score_max}　评分：${x.is_open?'开放':'关闭'}</p><p>指导教师：${esc(x.teacher_names)}　专业：${esc(x.major_name)}　组别：${esc(x.group_name)}</p><p style="white-space:pre-wrap">${esc(x.description)}</p>${x.attachment_url?`<p><a class="btn gray" href="${esc(x.attachment_url)}" target="_blank">查看作品附件</a></p>`:''}<h3>评分维度</h3><div class="table-wrap"><table><thead><tr><th>维度</th><th>评分说明</th><th>分数</th><th>评语</th></tr></thead><tbody>${x.dimensions.map(d=>{const s=x.dimension_scores[String(d.id)]||{};return `<tr><td>${esc(d.name)}</td><td>${esc(d.description)}</td><td>${s.score??'-'}</td><td>${esc(s.comment)}</td></tr>`}).join('')||`<tr><td colspan="4">该赛项未配置维度，使用单一总分。</td></tr>`}</tbody></table></div><h3>参赛成员</h3><div class="table-wrap"><table><thead><tr><th>姓名</th><th>学校</th><th>角色</th><th>负责人</th></tr></thead><tbody>${x.participants.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.school)}</td><td>${esc(p.role_name)}</td><td>${p.is_leader?'是':'否'}</td></tr>`).join('')}</tbody></table></div><h3>成绩快照</h3><div class="table-wrap"><table><thead><tr><th>时间</th><th>来源</th><th>分数</th><th>原因</th><th>操作人</th></tr></thead><tbody>${x.snapshots.map(s=>`<tr><td>${esc(s.created_at)}</td><td>${snapshotSourceLabel(s.source_type)}</td><td>${s.score}</td><td>${esc(s.reason)}</td><td>${esc(s.created_by_name)}</td></tr>`).join('')||'<tr><td colspan="5">暂无成绩快照</td></tr>'}</tbody></table></div><h3>评委评分修订记录</h3><div class="table-wrap"><table><thead><tr><th>时间</th><th>原分数</th><th>新分数</th><th>原评语</th><th>新评语</th></tr></thead><tbody>${x.revisions.map(r=>`<tr><td>${esc(r.created_at)}</td><td>${r.old_score??'-'}</td><td>${r.new_score}</td><td>${esc(r.old_comment)}</td><td>${esc(r.new_comment)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无修订记录</td></tr>'}</tbody></table></div><p><button class="btn" onclick="scoreTask(${id})">${x.current_score?'修改评分':'提交评分'}</button></p></div>`};
const snapshotSourceLabel=value=>({REVIEWER_SUBMISSION:'评委提交',SYSTEM_AVERAGE:'系统汇总',ADMIN_CORRECTION:'管理员改分',ADMIN_IMPORT:'成绩导入',ADMIN_IMPORT_CORRECTION:'导入修正'})[value]||value;
window.scoreTask=async id=>{const x=await api('/review/assignments/'+id),current=x.current_score||{};const fields=[{name:'score',label:`综合得分（${x.score_min}-${x.score_max}，手工填写）`,type:'number',required:true,value:current.score??''},{name:'comment',label:'总体评语',type:'textarea',wide:true,value:current.comment||''},...x.dimensions.flatMap(d=>{const saved=x.dimension_scores[String(d.id)]||{};return [{name:`dimension_${d.id}_score`,label:`${d.name}记录分（不参与综合得分）`,type:'number',required:true,value:saved.score??''},{name:`dimension_${d.id}_comment`,label:`${d.name}评语`,type:'textarea',wide:true,required:true,value:saved.comment||''}]})];openForm('提交综合得分及维度记录',fields,async data=>{const body={score:Number(data.score),comment:data.comment,dimensions:x.dimensions.map(d=>({dimension_id:d.id,score:Number(data[`dimension_${d.id}_score`]),comment:data[`dimension_${d.id}_comment`] }))};await api('/review/assignments/'+id+'/score',{method:'POST',body:JSON.stringify(body)});alert('综合得分和维度记录已保存，并生成成绩快照');await reviewerTasks()})};
async function assignments(){const names=['keyword','phase_id','reviewer_id','status'];window.assignmentFilterState=keepFilters('asf_',names,window.assignmentFilterState||{});const [d,o,st]=await Promise.all([api('/review/assignments?'+params(window.assignmentFilterState)),options(),api('/review/assignment-stats?'+params({phase_id:window.assignmentFilterState.phase_id}))]),f=window.assignmentFilterState,t=st.totals||{};$('#content').innerHTML=`<div class="panel"><div class="filters"><input id="asf_keyword" class="wide" placeholder="作品、报名号或评委" value="${esc(f.keyword)}"><select id="asf_phase_id"><option value="">全部阶段</option>${o.phases.map(p=>`<option value="${p.id}" ${String(p.id)===f.phase_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="asf_reviewer_id"><option value="">全部评委</option>${o.reviewers.map(u=>`<option value="${u.id}" ${String(u.id)===f.reviewer_id?'selected':''}>${esc(u.name||u.username)}</option>`).join('')}</select><select id="asf_status"><option value="">全部状态</option>${['ASSIGNED','SUBMITTED','CANCELLED'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${statusLabel(x)}</option>`).join('')}</select><div class="filter-actions"><button class="btn" onclick="assignments()">筛选</button><button class="btn gray" onclick="window.assignmentFilterState={};assignments()">重置</button><button class="btn" onclick="manualAssign()">手工分配</button><button class="btn green" onclick="autoAssign()">自动分配</button></div></div><div class="cards" style="margin-bottom:16px"><div class="card"><div class="muted">有效任务</div><div class="metric">${t.total||0}</div></div><div class="card"><div class="muted">已评分</div><div class="metric">${t.submitted||0}</div></div><div class="card"><div class="muted">待评分</div><div class="metric">${t.pending||0}</div></div></div><details style="margin-bottom:14px"><summary>查看评委工作量</summary><div class="table-wrap"><table><thead><tr><th>评委</th><th>总任务</th><th>已评分</th><th>待评分</th></tr></thead><tbody>${st.reviewers.map(x=>`<tr><td>${esc(x.name||x.username)}</td><td>${x.total}</td><td>${x.submitted}</td><td>${x.pending}</td></tr>`).join('')}</tbody></table></div></details><div class="muted" style="margin-bottom:10px">当前筛选 ${d.length} 条分配记录</div><div class="table-wrap"><table><thead><tr><th>ID</th><th>阶段</th><th>报名号</th><th>作品</th><th>评委</th><th>状态</th><th>分配时间</th><th>操作</th></tr></thead><tbody>${d.map(x=>`<tr><td>${x.id}</td><td>${esc(x.phase_name)}</td><td>${esc(x.entry_no)}</td><td>${esc(x.title).slice(0,28)}</td><td>${esc(x.reviewer_name||x.username)}</td><td>${x.status}</td><td>${esc(x.assigned_at)}</td><td>${x.status==='CANCELLED'?`<button class="btn green small" onclick="setAssignment(${x.id},'ASSIGNED')">恢复</button>`:`<button class="btn orange small" onclick="setAssignment(${x.id},'CANCELLED')">取消分配</button>`}</td></tr>`).join('')}</tbody></table></div></div>`}
window.autoAssign=async()=>{const phase=ask('评审阶段ID');if(!phase)return;const reviewers=ask('评委管理员ID，多个用逗号分隔');if(!reviewers)return;const count=ask('每个评分对象需要几位评委','1');if(count===null)return;if(!confirm('自动分配会为符合条件的全部作品建立评审任务，确定继续吗？'))return;try{const d=await api('/review/assignments/auto',{method:'POST',body:JSON.stringify({phase_id:intValue(phase),reviewer_ids:reviewers.split(',').map(Number),reviewers_per_target:intValue(count,1),only_initial_approved:true})});alert(`处理作品 ${d.targets} 个，新建分配 ${d.created} 条`);await assignments()}catch(e){alert(e.message)}};
window.manualAssign=async()=>{const o=await options();openForm('选择手工分配范围',[{name:'phase_id',label:'评审阶段',type:'select',value:o.phases[0]?.id,options:o.phases.map(p=>({value:p.id,label:p.name}))},{name:'keyword',label:'作品名或报名号（可空）',value:'',wide:true},{name:'region_id',label:'赛区',type:'select',value:'',options:[{value:'',label:'全部赛区'},...o.regions.map(x=>({value:x.id,label:x.name}))]},{name:'category_id',label:'赛项',type:'select',value:'',options:[{value:'',label:'全部赛项'},...o.categories.map(x=>({value:x.legacy_id,label:x.name}))]}],async data=>{await loadAssignmentCandidates(data)})};
window.loadAssignmentCandidates=async filter=>{const [rows,o]=await Promise.all([api('/review/candidates?'+params(filter)),options()]);window.assignmentCandidatePhase=intValue(filter.phase_id);$('#content').innerHTML=`<div class="panel"><button class="btn gray" onclick="assignments()">返回分配列表</button><h3>选择作品（最多显示500条）</h3><div style="margin-bottom:10px"><button class="btn gray small" onclick="document.querySelectorAll('.target-check').forEach(x=>x.checked=true)">全选作品</button> <button class="btn gray small" onclick="document.querySelectorAll('.target-check').forEach(x=>x.checked=false)">清空</button></div><div class="table-wrap" style="max-height:420px"><table><thead><tr><th>选择</th><th>报名号</th><th>作品</th><th>类型</th><th>已分配</th><th>已评分</th></tr></thead><tbody>${rows.map(x=>`<tr><td><input class="target-check" type="checkbox" value="${x.target_id}" style="width:auto"></td><td>${esc(x.entry_no)}</td><td>${esc(x.title)}</td><td>${x.entry_type==='TEAM'?'团体':'个人'}</td><td>${x.assigned_count}</td><td>${x.submitted_count||0}</td></tr>`).join('')}</tbody></table></div><h3>选择评委</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${o.reviewers.map(u=>`<label><input class="reviewer-check" type="checkbox" value="${u.id}" style="width:auto"> ${esc(u.name||u.username)}</label>`).join('')}</div><p><button class="btn" onclick="submitManualAssignment()">确认分配</button></p></div>`};
window.submitManualAssignment=async()=>{const target_ids=[...document.querySelectorAll('.target-check:checked')].map(x=>Number(x.value)),reviewer_ids=[...document.querySelectorAll('.reviewer-check:checked')].map(x=>Number(x.value));if(!target_ids.length||!reviewer_ids.length){alert('请至少选择一个作品和一位评委');return}if(!confirm(`确定将 ${target_ids.length} 个评分对象分配给 ${reviewer_ids.length} 位评委吗？`))return;try{const d=await api('/review/assignments',{method:'POST',body:JSON.stringify({phase_id:window.assignmentCandidatePhase,target_ids,reviewer_ids})});alert(`新建 ${d.created} 条分配记录`);await assignments()}catch(e){alert(e.message)}};
window.setAssignment=async(id,status)=>{if(!confirm(status==='CANCELLED'?'确定取消该评审任务吗？':'确定恢复该评审任务吗？'))return;try{await api('/review/assignments/'+id,{method:'PATCH',body:JSON.stringify({status})});await assignments()}catch(e){alert(e.message)}};
async function scores(){const names=['keyword','phase_id','region_id','category_id','advance_status','score_min','score_max'];window.scoreFilterState=keepFilters('sf_',names,window.scoreFilterState||{});const [d,o]=await Promise.all([api(`/scores?page=${page}&limit=20&${params(window.scoreFilterState)}`),options()]);const f=window.scoreFilterState;$('#content').innerHTML=`<div class="panel"><div class="filters"><input id="sf_keyword" class="wide" placeholder="作品名或报名号" value="${esc(f.keyword)}"><select id="sf_phase_id"><option value="">全部阶段</option>${o.phases.map(p=>`<option value="${p.id}" ${String(p.id)===f.phase_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="sf_region_id"><option value="">全部赛区</option>${o.regions.map(x=>`<option value="${x.id}" ${String(x.id)===f.region_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="sf_category_id"><option value="">全部赛项</option>${o.categories.map(x=>`<option value="${x.legacy_id}" ${String(x.legacy_id)===f.category_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="sf_advance_status"><option value="">全部晋级状态</option>${['ELIGIBLE','ADVANCED','ELIMINATED','LOCKED'].map(x=>`<option value="${x}" ${f.advance_status===x?'selected':''}>${statusLabel(x)}</option>`).join('')}</select><input id="sf_score_min" type="number" step="0.01" placeholder="最低分" value="${esc(f.score_min)}"><input id="sf_score_max" type="number" step="0.01" placeholder="最高分" value="${esc(f.score_max)}"><div class="filter-actions"><button class="btn" onclick="page=1;scores()">筛选</button><button class="btn gray" onclick="window.scoreFilterState={};scores()">重置</button></div></div><div class="muted" style="margin-bottom:10px">共 ${d.total.toLocaleString()} 条最终成绩</div><div class="table-wrap"><table><thead><tr><th>阶段</th><th>报名号</th><th>作品</th><th>评委数</th><th>平均分</th><th>最终分</th><th>晋级状态</th><th>操作</th></tr></thead><tbody>${d.data.map(x=>`<tr><td>${esc(x.phase_name)}</td><td>${esc(x.entry_no)}</td><td>${esc(x.title).slice(0,30)}</td><td>${x.valid_reviewer_count}</td><td>${x.average_score??'-'}</td><td>${x.final_score??'-'}</td><td>${esc(x.advance_status||'ELIGIBLE')}</td><td><button class="btn gray small" onclick="scoreSnapshots(${x.id})">成绩快照</button> <button class="btn green small" onclick="advanceTarget(${x.evaluation_target_id},${x.phase_id},'ADVANCED')">晋级</button> <button class="btn orange small" onclick="advanceTarget(${x.evaluation_target_id},${x.phase_id},'ELIMINATED')">淘汰</button> <button class="btn gray small" onclick="advanceTarget(${x.evaluation_target_id},${x.phase_id},'LOCKED')">锁定</button></td></tr>`).join('')}</tbody></table></div>${pager(d.total,d.limit)}</div>`}
window.advanceTarget=async(target,phase,status)=>{const reason=ask('调整原因（可空）','');if(reason===null)return;try{await api('/review/targets/'+target+'/advance',{method:'POST',body:JSON.stringify({phase_id:phase,status,reason})});await scores()}catch(e){alert(e.message)}};
window.scoreSnapshots=async scoreId=>{const rows=await api('/scores/'+scoreId+'/snapshots');$('#content').innerHTML=`<div class="panel"><button class="btn gray" onclick="scores()">返回成绩统计</button><h3>省审/国审成绩快照</h3><p class="muted">最新一条为当前业务依据；管理员改分后，评奖使用修改后的最新总分，历史评委分不会被覆盖。</p><div class="table-wrap"><table><thead><tr><th>时间</th><th>来源</th><th>分数</th><th>原因</th><th>操作人</th><th>维度明细</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.created_at)}</td><td>${snapshotSourceLabel(s.source_type)}</td><td>${s.score}</td><td>${esc(s.reason)}</td><td>${esc(s.created_by_name)}</td><td style="white-space:normal;max-width:520px">${esc(JSON.stringify(s.detail||s.detail_json||''))}</td></tr>`).join('')||'<tr><td colspan="6">暂无成绩快照</td></tr>'}</tbody></table></div></div>`};
async function scorePublishing(){const [d,o]=await Promise.all([api('/review/publications'),options()]);$('#content').innerHTML=`<div class="panel"><div class="muted" style="margin-bottom:14px">成绩与证书分别控制公开状态；关闭公开不会删除数据。提交下一阶段只处理已标记“晋级”的评分对象。</div><div class="table-wrap"><table><thead><tr><th>赛事</th><th>阶段</th><th>代码</th><th>成绩状态</th><th>证书状态</th><th>发布时间</th><th>发布人</th><th>操作</th></tr></thead><tbody>${d.map(x=>`<tr><td>${esc(o.competitions.find(c=>c.id===x.competition_id)?.name||x.competition_id)}</td><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td><span class="badge ${x.is_published?'ok':'bad'}">${x.is_published?'已发布':'未发布'}</span></td><td><span class="badge ${x.certificates_published?'ok':'bad'}">${x.certificates_published?'已公开':'未公开'}</span></td><td>${esc(x.published_at)}</td><td>${esc(x.published_by_name)}</td><td>${x.is_published?`<button class="btn orange small" onclick="setScorePublication(${x.phase_id},false)">下线成绩</button>`:`<button class="btn green small" onclick="setScorePublication(${x.phase_id},true)">发布成绩</button>`} ${x.certificates_published?`<button class="btn orange small" onclick="setCertificatePublication(${x.phase_id},false)">关闭证书</button>`:`<button class="btn green small" onclick="setCertificatePublication(${x.phase_id},true)">公开证书</button>`} <button class="btn gray small" onclick="promotePhase(${x.phase_id})">提交下一阶段</button></td></tr>`).join('')}</tbody></table></div></div>`}
window.setCertificatePublication=async(id,published)=>{if(!confirm(`确定${published?'公开':'关闭'}该阶段证书吗？`))return;await api('/review/phases/'+id+'/publish-certificates',{method:'POST',body:JSON.stringify({is_published:published})});scorePublishing()};

async function awardRules(){const d=await api('/awards/rules');awardsData=d;$('#content').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn" onclick="createAwardRule()">新增奖项规则</button><span class="muted">共 ${d.length} 条；奖项不设名额，成绩落入区间后自动发放</span></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>赛事ID</th><th>阶段ID</th><th>奖项名称</th><th>分数范围</th><th>获奖对象</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.length?d.map(x=>`<tr><td>${x.id}</td><td>${x.competition_id}</td><td>${x.phase_id}</td><td>${esc(x.award_name)}</td><td>${x.min_score??'-'} - ${x.max_score??'-'}</td><td>${esc(x.recipient_type)}</td><td>${x.sort_order||0}</td><td>${x.status}</td><td><button class="btn small" onclick="editAwardRule(${x.id})">编辑</button> <button class="btn ${x.status?'orange':'green'} small" onclick="toggleAwardRule(${x.id})">${x.status?'停用':'启用'}</button></td></tr>`).join(''):'<tr><td colspan="9" class="muted">当前数据库尚未配置奖项规则，请点击“新增奖项规则”创建</td></tr>'}</tbody></table></div></div>`}
const awardFields=(x,o)=>[{name:'competition_id',label:'赛事',type:'select',value:x?.competition_id||o.competitions[0]?.id,options:o.competitions.map(v=>({value:v.id,label:v.name}))},{name:'phase_id',label:'评审阶段',type:'select',value:x?.phase_id||o.phases[0]?.id,options:o.phases.map(v=>({value:v.id,label:v.name}))},{name:'award_name',label:'奖项名称',required:true,value:x?.award_name||'',wide:true},{name:'min_score',label:'最低分（可空）',type:'number',value:x?.min_score??''},{name:'max_score',label:'最高分（可空）',type:'number',value:x?.max_score??''},{name:'recipient_type',label:'获奖对象',type:'select',value:x?.recipient_type||'ENTRY',options:['ENTRY','PARTICIPANT','TEACHER','SCHOOL'].map(v=>({value:v,label:v}))},{name:'sort_order',label:'排序',type:'number',value:x?.sort_order||0},{name:'status',label:'状态',type:'select',value:x?.status??1,options:[{value:1,label:'启用'},{value:0,label:'停用'}]}];

function decorateBatchTable(kind){
  if(view!==kind)return;
  const table=$('#content .table-wrap table');
  if(!table||table.dataset.batchReady)return;
  table.dataset.batchReady='1';
  const head=table.querySelector('thead tr');
  head.insertAdjacentHTML('afterbegin','<th><input type="checkbox" aria-label="全选"></th>');
  const all=head.querySelector('input');
  table.querySelectorAll('tbody tr').forEach(row=>{
    const id=row.cells[0]?.textContent.trim();
    row.insertAdjacentHTML('afterbegin',`<td><input class="batch-item" type="checkbox" value="${esc(id)}" aria-label="选择 ${esc(id)}"></td>`);
  });
  all.onchange=()=>table.querySelectorAll('.batch-item').forEach(x=>x.checked=all.checked);
  const wrap=table.closest('.table-wrap');
  const actions=document.createElement('div');
  actions.className='filter-actions'; actions.style.marginBottom='10px';
  actions.innerHTML=kind==='entries'
    ?'<button class="btn green" onclick="batchReviewEntries(\'APPROVED\')">批量通过</button><button class="btn orange" onclick="batchReviewEntries(\'REJECTED\')">批量驳回</button>'
    :'<button class="btn green" onclick="batchAuditAccounts(0)">批量通过</button><button class="btn orange" onclick="batchAuditAccounts(2)">批量拒绝</button><button class="btn gray" onclick="batchAuditAccounts(1)">设为待审</button>';
  wrap.parentNode.insertBefore(actions,wrap);
}

const adminStatusLabels={ACTIVE:'正常',APPROVED:'已通过',REJECTED:'已驳回',WITHDRAWN:'已撤回',DELETED:'已删除',HISTORICAL:'历史数据',ASSIGNED:'已分配',SUBMITTED:'已评分',CANCELLED:'已取消',PENDING:'待处理',PROCESSING:'处理中',SUCCESS:'成功',FAILED:'失败',PUBLISHED:'已发布',REVOKED:'已撤销',DRAFT:'草稿',ELIGIBLE:'待晋级',ADVANCED:'已晋级',ELIMINATED:'已淘汰',LOCKED:'已锁定'};

categories=async()=>{

  $('#categoryCompetitionSelect').onchange=e=>{window.categoryCompetitionId=e.target.value;window.categoryExpanded=new Set();window.categoryExpandedInitialized=false;filterOptions=null;categories()};

window.createReviewerScope=async()=>{const o=await options(),competition=o.competitions[0],roots=o.categories.filter(x=>!Number(x.parent_legacy_id||0)&&(!competition||!Number(x.competition_id)||Number(x.competition_id)===Number(competition.id)));openForm('新增评委账号及评审范围',[{name:'username',label:'登录账号',required:true,value:''},{name:'name',label:'评委姓名',required:true,value:''},{name:'password',label:'初始密码（至少8位）',type:'password',required:true,value:''},{name:'phone',label:'联系电话（可选）',value:''},{name:'competition_id',label:'所属届次',type:'select',required:true,value:competition?.id,options:o.competitions.map(x=>({value:x.id,label:x.name}))},{name:'phase_code',label:'评审阶段',type:'select',value:'INITIAL',options:[{value:'INITIAL',label:'初审'},{value:'PROVINCIAL',label:'复赛'},{value:'NATIONAL',label:'决赛'}]},{name:'first_category_legacy_id',label:'赛项',type:'select',required:true,value:roots[0]?.legacy_id,options:roots.map(x=>({value:x.legacy_id,label:x.name}))},{name:'second_category_legacy_id',label:'专业',type:'select',value:0,options:[{value:0,label:'全部专业'}]},{name:'region_id',label:'赛区',type:'select',value:0,options:[{value:0,label:'全部赛区'},...o.regions.map(x=>({value:x.id,label:x.name}))]},{name:'status',label:'账号及范围状态',type:'select',value:1,options:[{value:1,label:'启用'},{value:0,label:'停用'}]}],async data=>{for(const k of ['competition_id','first_category_legacy_id','second_category_legacy_id','region_id','status'])data[k]=Number(data[k]);data.create_account=true;await api('/review/scopes',{method:'POST',body:JSON.stringify(data)});filterOptions=null;await reviewerScopes()})};
window.toggleReviewerScope=async(id,status)=>{try{await api('/review/scopes/'+id,{method:'PATCH',body:JSON.stringify({status})});await reviewerScopes()}catch(e){alert(e.message)}};

async function awardImports(){
  if(editionDatabase!=='cqtxj2027'){return $('#content').innerHTML='<div class="panel">往届数据只读，不支持奖项二次导入。</div>'}
  const [rows,o]=await Promise.all([api('/award-imports'),options()]);
  $('#content').innerHTML=`<div class="panel"><h3>导出带分数的完整作品表</h3><p class="muted">按赛项、赛区、作品唯一ID升序导出。线下只填写对应阶段的奖项列，再将原表上传；系统仅以“作品唯一ID＋作品名称”校验并更新奖项，任意一行错误则整批驳回。</p><form id="awardExportForm" class="filters"><select name="competition_id"><option value="">全部届次</option>${o.competitions.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><select name="category_id"><option value="">全部赛项</option>${o.categories.filter(x=>!Number(x.parent_legacy_id||0)).map(x=>`<option value="${x.legacy_id}">${esc(x.name)}</option>`).join('')}</select><select name="region_id"><option value="">全部赛区</option>${o.regions.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><select name="source_database"><option value="">全部来源</option><option value="zhongxi">中戏</option><option value="qudao">渠道</option><option value="houtai">后台</option></select><button class="btn gray" type="submit">导出奖项填写表</button></form><h3 style="margin-top:26px">导入奖项</h3><form id="awardImportForm" class="filters"><select name="competition_id" required><option value="">选择届次</option>${o.competitions.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><select name="phase_code" required><option value="PROVINCIAL">省赛奖项</option><option value="NATIONAL">国赛奖项</option></select><label>后台导出的 Excel<input type="file" name="excel_file" accept=".xlsx" required></label><button class="btn" type="submit">整批校验并导入</button></form><h3 style="margin-top:26px">导入记录</h3><div class="table-wrap"><table><thead><tr><th>时间</th><th>届次</th><th>阶段</th><th>文件</th><th>状态</th><th>总数</th><th>成功</th><th>失败</th><th>错误</th><th>操作人</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.competition_name)}</td><td>${x.phase_code==='PROVINCIAL'?'省赛':'国赛'}</td><td>${esc(x.excel_name)}</td><td><span class="badge ${x.status==='SUCCESS'?'ok':x.status==='REJECTED'?'bad':''}">${statusLabel(x.status)}</span></td><td>${x.total_rows}</td><td>${x.success_count}</td><td>${x.failed_count}</td><td title="${esc(x.error_message)}">${esc(x.error_message).slice(0,80)}</td><td>${esc(x.admin_name)}</td></tr>`).join('')||'<tr><td colspan="10">暂无导入记录</td></tr>'}</tbody></table></div></div>`;
  $('#awardExportForm').onsubmit=downloadAwardUpdateTable;$('#awardImportForm').onsubmit=submitAwardImport;
}
async function downloadAwardUpdateTable(e){e.preventDefault();const query=new URLSearchParams(new FormData(e.currentTarget));const r=await fetch('/api/admin/award-update-export.xlsx?'+query,{headers:{Authorization:'Bearer '+token,...editionHeaders()}});if(!r.ok)return alert('导出失败');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='奖项二次导入表.xlsx';a.click();URL.revokeObjectURL(a.href)}
async function submitAwardImport(e){e.preventDefault();const button=e.currentTarget.querySelector('button[type=submit]');button.disabled=true;try{const r=await fetch('/api/admin/award-imports',{method:'POST',headers:{Authorization:'Bearer '+token,...editionHeaders()},body:new FormData(e.currentTarget)}),j=await r.json();if(j.code!==200)throw Error(j.message);alert(j.message);await awardImports()}catch(x){alert(x.message)}finally{button.disabled=false}}

certificates=async()=>{const names=['keyword','award_name','certificate_type','source_database','is_dirty','is_obsolete','date_from','date_to'];window.certFilterState=keepFilters('cf_',names,window.certFilterState||{});const f=window.certFilterState,d=await api(`/certificates?page=${page}&limit=20&${params(f)}`),types={0:'指导教师',1:'组织单位',ENTRY:'作品',PARTICIPANT:'参赛者',TEACHER:'指导教师',SCHOOL:'学校/单位'};$('#content').innerHTML=`<div class="panel"><p class="muted">重新生成证书时会创建新版本、新编号；旧证书和旧文件保留并标记为“已作废”，便于追溯。</p><div class="filters"><input id="cf_keyword" class="wide" placeholder="姓名、证件号、证书编号或作品名" value="${esc(f.keyword)}"><input id="cf_award_name" placeholder="奖项名称" value="${esc(f.award_name)}"><select id="cf_certificate_type"><option value="">全部证书对象</option>${Object.entries(types).map(([v,l])=>`<option value="${v}" ${f.certificate_type===v?'selected':''}>${l}</option>`).join('')}</select><select id="cf_source_database"><option value="">全部来源</option>${['zhongxi','qudao','houtai'].map(v=>`<option value="${v}" ${f.source_database===v?'selected':''}>${statusLabel(v)}</option>`).join('')}</select><select id="cf_is_dirty"><option value="">全部资料状态</option><option value="1" ${f.is_dirty==='1'?'selected':''}>资料变更待重做</option><option value="0" ${f.is_dirty==='0'?'selected':''}>资料未变更</option></select>${editionDatabase==='cqtxj2027'?`<select id="cf_is_obsolete"><option value="">全部版本</option><option value="0" ${f.is_obsolete==='0'?'selected':''}>当前版本</option><option value="1" ${f.is_obsolete==='1'?'selected':''}>已作废历史版本</option></select>`:''}<input id="cf_date_from" type="date" value="${esc(f.date_from)}"><input id="cf_date_to" type="date" value="${esc(f.date_to)}"><div class="filter-actions"><button class="btn" onclick="page=1;certificates()">筛选</button><button class="btn gray" onclick="window.certFilterState={};page=1;certificates()">重置</button></div></div><div class="muted">共 ${Number(d.total).toLocaleString()} 份证书</div><div class="table-wrap"><table><thead><tr><th>证书编号</th><th>版本</th><th>获奖人</th><th>作品</th><th>奖项</th><th>类型</th><th>状态</th><th>生成时间</th><th>操作</th></tr></thead><tbody>${d.data.map(x=>`<tr><td>${esc(x.certificate_no)}</td><td>V${x.version_no||1}</td><td>${esc(x.recipient_name||x.teacher_names||x.school_names||'-')}</td><td>${esc(x.title_snapshot).slice(0,30)}</td><td>${esc(x.award_name)}</td><td>${esc(types[x.certificate_type]||x.certificate_type)}</td><td><span class="badge ${x.is_obsolete||x.is_dirty?'bad':'ok'}">${x.is_obsolete?'已作废':x.is_dirty?'待重做':'当前有效'}</span>${x.obsolete_reason?`<br><span class="muted">${esc(x.obsolete_reason)}</span>`:''}</td><td>${esc(x.regenerated_at||x.created_at)}</td><td>${x.file_url?`<a class="btn gray small" href="${esc(x.file_url)}" target="_blank">查看</a>`:''} ${!x.is_obsolete&&editionDatabase==='cqtxj2027'?`<button class="btn ${x.is_dirty?'orange':'gray'} small" onclick="regenerateCertificate(${x.id})">重新生成</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9">暂无证书</td></tr>'}</tbody></table></div>${pager(d.total,d.limit)}</div>`};

const originalAccounts=accounts;
accounts=async()=>{await originalAccounts();setTimeout(()=>{$('#content').querySelectorAll('tbody tr').forEach(row=>{const cells=row.querySelectorAll('td');if(cells[2]?.textContent.trim()==='学校'){cells[8].innerHTML='<span class="badge ok">无需账号审核</span>';cells[9].innerHTML='<span class="muted">按届次审核报名资格</span>';const check=row.querySelector('.batch-item');if(check){check.checked=false;check.disabled=true}}})},0)};

window.reviewTaskDetail=async id=>{const x=await api('/review/assignments/'+id);$('#content').innerHTML=`<div class="panel"><button class="btn gray" onclick="reviewerTasks()">返回任务</button><h3>${esc(x.title)}</h3><p>阶段：${esc(x.phase_name)}　报名号：${esc(x.entry_no)}　分数范围：${x.score_min}-${x.score_max}　评分：${x.is_open?'开放':'关闭'}</p><p>赛项：${esc(x.category_name)}　专业：${esc(x.major_name)}　组别：${esc(x.group_name)}　参赛人数：${x.participant_count||1}</p><p style="white-space:pre-wrap">${esc(x.description)}</p>${x.attachment_url?`<p><a class="btn gray" href="${esc(x.attachment_url)}" target="_blank">查看作品附件</a></p>`:''}<h3>评分维度记录</h3><div class="table-wrap"><table><thead><tr><th>维度</th><th>评分说明</th><th>记录分</th><th>评语</th></tr></thead><tbody>${x.dimensions.map(d=>{const s=x.dimension_scores[String(d.id)]||{};return `<tr><td>${esc(d.name)}</td><td>${esc(d.description)}</td><td>${s.score??'-'}</td><td>${esc(s.comment)}</td></tr>`}).join('')||'<tr><td colspan="4">该赛项未配置维度。</td></tr>'}</tbody></table></div><h3>成绩快照</h3><div class="table-wrap"><table><thead><tr><th>时间</th><th>来源</th><th>分数</th><th>原因</th></tr></thead><tbody>${x.snapshots.map(s=>`<tr><td>${esc(s.created_at)}</td><td>${snapshotSourceLabel(s.source_type)}</td><td>${s.score}</td><td>${esc(s.reason)}</td></tr>`).join('')||'<tr><td colspan="4">暂无成绩快照</td></tr>'}</tbody></table></div><p><button class="btn" onclick="scoreTask(${id})">${x.current_score?'修改评分':'提交评分'}</button></p></div>`};

Object.assign(window,{show,api,openForm,entries,entryComplete,accounts,schoolQualifications,reviewerScopes,awardImports,scores,certificates,adminUsers,statistics,news,selectedBatchIds});
boot();
