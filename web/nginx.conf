# weiran4j 前端 Nginx：静态文件 + /api-backend/ 同源反代（契约 §4、D-014、docs/02-部署.md）。
#
# 同源是硬要求：认证 Cookie 为 SameSite=Strict、后端不提供 CORS。下列头必须原样透传——
#   Cookie / Set-Cookie（认证）、X-CSRF-Token（写请求的 CSRF 校验）、X-Request-Id（请求号）。
# Nginx 默认就透传它们；**不要**在这里加 proxy_hide_header Set-Cookie 之类的配置。
# 上游（外层网关 / 负载均衡）传来了请求号就沿用，没有才用 Nginx 自己生成的 $request_id。
# 后端还会再做一次白名单校验，不合法的值会被重新生成。
map $http_x_request_id $weiran_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location /api-backend/ {
        proxy_pass http://backend:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 请求号交给后端（见上方 map）；后端沿用合法值并写回响应头，Nginx、网关与应用日志因此能用同一个值串起来。
        proxy_set_header X-Request-Id $weiran_request_id;
        # 停机期间后端最多等 30s 处理完在途请求，读超时要比它长。
        proxy_read_timeout 60s;
    }

    # 带内容哈希的产物：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：未知路径回落到 index.html；index.html 本身不缓存，发版后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
