# 下游（weiran-cqt）集成测试配置：作为 application-biz.yml 的 test profile 变体加载。
# 固定的测试专用密钥，与上游 application-test.yml 的后台测试密钥不同（前后台令牌互斥的测试依赖这一点）。
weiran:
  cqt:
    jwt:
      secret: integration-test-portal-secret-at-least-32-bytes
      ttl: 1h
    sms:
      # IP 限流用例在 CqtSmsLimitIT 里单独覆盖为 2。
      ip-hourly-limit: 1000
    commitment-template-url: https://example.com/commitment-template.docx
    # 测试用低强度，只为加速；旧库 $2y$10$ 哈希照样能校验。
    bcrypt-strength: 4
    storage:
      # 本地目录存储（默认在系统临时目录下 cqt-uploads），IT 经 /uploads/** 取回文件。
      mode: local
  sms:
    mode: local
