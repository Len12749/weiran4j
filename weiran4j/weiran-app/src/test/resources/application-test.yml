# 集成测试配置：数据源由 Testcontainers 的 @ServiceConnection 注入，这里不写 URL。
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/app-demo
    fail-on-missing-locations: false

weiran:
  storage:
    mode: local
    local:
      root: build/test-uploads
      url-prefix: /system-uploads
  system:
    # 测试用低强度，只为让每次建用户 / 改密不至于花掉上百毫秒；种子数据的 cost 10 哈希照样能校验。
    bcrypt-strength: 4
  auth:
    jwt:
      secret: integration-test-secret-key-at-least-32-bytes
      ttl: 1h

logging:
  level:
    com.weiran: INFO
