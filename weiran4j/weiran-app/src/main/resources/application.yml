spring:
  application:
    name: weiran4j
  config:
    # 业务模块的默认配置（D-012，契约 §2.2）：放在某个业务模块的 classpath 根，全应用只能有一份。
    # 它覆盖本文件的同名键，但低于 profile 文件与环境变量；不存在时忽略。密钥不放那里（CP-9）。
    import: optional:classpath:application-biz.yml
  datasource:
    url: ${WEIRAN_DB_URL:jdbc:mysql://127.0.0.1:3306/weiran4j?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${WEIRAN_DB_USERNAME:root}
    password: ${WEIRAN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    # 递归扫描：各模块 infrastructure 把脚本放在 db/migration/<module>/ 下。
    locations: classpath:db/migration
    # 上下游（fork）的脚本时间戳必然交错：后合入的低版本脚本要补执行，而不是让启动失败（D-012）。
    # 代价是执行顺序不再严格等于版本号顺序——脚本之间不得依赖版本号之外的隐含次序。
    out-of-order: true
  web:
    # 校验提示语（如「不能为空」）按固定中文输出，不随客户端 Accept-Language 漂移。
    locale: zh_CN
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  lifecycle:
    # 每个停机阶段最多等多久（进行中的请求、操作日志线程池）；容器编排的强杀时限要比它长（见 docs/02-部署.md）。
    timeout-per-shutdown-phase: ${WEIRAN_SHUTDOWN_TIMEOUT:30s}

server:
  port: ${WEIRAN_PORT:3310}
  # Spring Boot 3.4 起默认就是 graceful；显式写出，不随框架默认值漂移。
  shutdown: graceful

weiran:
  system:
    bcrypt-strength: 10
    storage:
      mode: ${WEIRAN_STORAGE_MODE:disabled}
      local-root: ${WEIRAN_STORAGE_LOCAL_ROOT:uploads}
      local-url-prefix: ${WEIRAN_STORAGE_LOCAL_URL_PREFIX:/system-uploads}
      oss:
        endpoint: ${WEIRAN_STORAGE_OSS_ENDPOINT:}
        bucket: ${WEIRAN_STORAGE_OSS_BUCKET:}
        access-key-id: ${WEIRAN_STORAGE_OSS_ACCESS_KEY_ID:}
        access-key-secret: ${WEIRAN_STORAGE_OSS_ACCESS_KEY_SECRET:}
        public-base-url: ${WEIRAN_STORAGE_OSS_PUBLIC_BASE_URL:}
  auth:
    jwt:
      # 生产环境必须由环境变量注入，至少 32 字节；缺失或过短时应用启动失败。仓库里不放真实密钥。
      secret: ${WEIRAN_JWT_SECRET:}
      ttl: ${WEIRAN_JWT_TTL:12h}
      # 本地令牌的签发方与受众（JWT iss / aud），认证按 iss 选校验器（D-014）。
      issuer: ${WEIRAN_JWT_ISSUER:weiran4j}
      audience: ${WEIRAN_JWT_AUDIENCE:weiran4j}
    cookie:
      # 认证 Cookie 是否带 Secure。线上走 HTTPS 保持 true；本地 http://localhost 在 config/application-local.yml 设 false。
      secure: ${WEIRAN_COOKIE_SECURE:true}
    # 对外访问地址（不带结尾斜杠）：拼外部登录的回调与登出回跳地址，不从请求头推断（防 Host 头注入，D-015）。
    public-base-url: ${WEIRAN_PUBLIC_BASE_URL:http://localhost:5373}
    password-login:
      # 关闭后只有内置超管能用密码登录（外部身份提供方故障时的应急入口）。
      enabled: ${WEIRAN_PASSWORD_LOGIN_ENABLED:true}
    # 外部身份提供方（CAS / OIDC）按部署配置，写成环境变量 WEIRAN_AUTH_PROVIDERS_<ID>_*，见 docs/02-部署.md。
    providers: {}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# OpenAPI 文档默认关闭，只在 local profile 打开（见 application-local.yml）。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.weiran: ${WEIRAN_LOG_LEVEL:INFO}
  # 日志文件目录与保留天数，logback-spring.xml 读取（local / test profile 只输出到控制台，不写文件）。
  file:
    path: ${WEIRAN_LOG_DIR:logs}
  logback:
    rollingpolicy:
      max-history: ${WEIRAN_LOG_MAX_HISTORY:30}
